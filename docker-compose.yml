services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbershop-platform-api
    environment:
      APP_NAME: ${APP_NAME:-barbershop-platform}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barbershop_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3004,http://127.0.0.1:3004,http://localhost:4040,http://127.0.0.1:4040,http://localhost:3010,http://127.0.0.1:3010,http://localhost:8000,http://127.0.0.1:8000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-stub}
      SMS_SENDER_NAME: ${SMS_SENDER_NAME:-}
      SMS_CLUB_TOKEN: ${SMS_CLUB_TOKEN:-}
      SMS_CLUB_BASE_URL: ${SMS_CLUB_BASE_URL:-https://im.smsclub.mobi}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_SEND_TIMEOUT_SECONDS: ${TELEGRAM_SEND_TIMEOUT_SECONDS:-10}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://soulcuts.com.ua}
      MESSAGING_MAX_RETRY_ATTEMPTS: ${MESSAGING_MAX_RETRY_ATTEMPTS:-3}
      MESSAGING_RETRY_DELAY_MINUTES: ${MESSAGING_RETRY_DELAY_MINUTES:-15}
      MESSAGING_BATCH_SIZE: ${MESSAGING_BATCH_SIZE:-50}
      MESSAGING_DEFAULT_REVIEW_URL: ${MESSAGING_DEFAULT_REVIEW_URL:-}
      BARBERSHOP_NAME: ${BARBERSHOP_NAME:-Soulcuts}
    command: sh /app/scripts/start.sh
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/public/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    container_name: barbershop-platform-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbershop_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbershop_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
