services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: barbershop-platform-api
    environment:
      APP_NAME: ${APP_NAME:-barbershop-platform}
      APP_ENV: ${APP_ENV:-local}
      SENTRY_INCIDENT_STORE: ${SENTRY_INCIDENT_STORE:-data/private/sentry-incidents.sqlite3}
      SHOP_CHECKOUT_ENABLED: ${SHOP_CHECKOUT_ENABLED:-false}
      SHOP_CHECKOUT_PILOT_ENABLED: ${SHOP_CHECKOUT_PILOT_ENABLED:-false}
      SHOP_CHECKOUT_PILOT_CUSTOMER_IDS: ${SHOP_CHECKOUT_PILOT_CUSTOMER_IDS:-}
      SHOP_PAYMENT_RESOLUTIONS_ENABLED: ${SHOP_PAYMENT_RESOLUTIONS_ENABLED:-false}
      SHOP_PAYMENT_RESOLUTION_MANUAL_POLICY: ${SHOP_PAYMENT_RESOLUTION_MANUAL_POLICY:-null}
      SHOP_NP_RETURNS_ENABLED: ${SHOP_NP_RETURNS_ENABLED:-false}
      SHOP_NP_RETURN_LIVE_TRANSPORT_ENABLED: ${SHOP_NP_RETURN_LIVE_TRANSPORT_ENABLED:-false}
      SHOP_NP_RETURN_PROFILE: ${SHOP_NP_RETURN_PROFILE:-null}
      SHOP_NP_RETURN_API_KEY: ${SHOP_NP_RETURN_API_KEY:-}
      SHOP_PAYMENTS_ENABLED: ${SHOP_PAYMENTS_ENABLED:-false}
      SHOP_PAYMENT_MANUAL_POLICY: ${SHOP_PAYMENT_MANUAL_POLICY:-null}
      SHOP_MONOBANK_LIVE_TRANSPORT_ENABLED: ${SHOP_MONOBANK_LIVE_TRANSPORT_ENABLED:-false}
      SHOP_MONOBANK_PROFILE: ${SHOP_MONOBANK_PROFILE:-null}
      SHOP_MONOBANK_TOKEN: ${SHOP_MONOBANK_TOKEN:-}
      SHOP_ORDER_OPERATIONS_ENABLED: ${SHOP_ORDER_OPERATIONS_ENABLED:-false}
      SHOP_FISCAL_MOCK_ENABLED: ${SHOP_FISCAL_MOCK_ENABLED:-false}
      SHOP_CARRIER_RETURNS_MOCK_ENABLED: ${SHOP_CARRIER_RETURNS_MOCK_ENABLED:-false}
      SHOP_CHECKBOX_ENABLED: ${SHOP_CHECKBOX_ENABLED:-false}
      SHOP_CHECKBOX_LIVE_TRANSPORT_ENABLED: ${SHOP_CHECKBOX_LIVE_TRANSPORT_ENABLED:-false}
      SHOP_CHECKBOX_PROFILE: ${SHOP_CHECKBOX_PROFILE:-null}
      SHOP_CHECKBOX_LOGIN: ${SHOP_CHECKBOX_LOGIN:-}
      SHOP_CHECKBOX_PASSWORD: ${SHOP_CHECKBOX_PASSWORD:-}
      SHOP_CHECKBOX_LICENSE_KEY: ${SHOP_CHECKBOX_LICENSE_KEY:-}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      API_WORKERS: ${API_WORKERS:-1}
      BACKGROUND_WORKERS_ENABLED: ${BACKGROUND_WORKERS_ENABLED:-true}
      CUSTOMER_ACTIVITY_NOTIFICATION_SCHEDULER_ENABLED: ${CUSTOMER_ACTIVITY_NOTIFICATION_SCHEDULER_ENABLED:-true}
      BACKGROUND_OWNER_HEARTBEAT_SECONDS: ${BACKGROUND_OWNER_HEARTBEAT_SECONDS:-5}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
      SHARED_INGRESS_LIMITS_ENABLED: ${SHARED_INGRESS_LIMITS_ENABLED:-false}
      OTP_SOURCE_SEND_LIMIT: ${OTP_SOURCE_SEND_LIMIT:-5}
      OTP_SOURCE_VERIFY_LIMIT: ${OTP_SOURCE_VERIFY_LIMIT:-20}
      CHECKOUT_SOURCE_LIMIT: ${CHECKOUT_SOURCE_LIMIT:-30}
      SOURCE_LIMIT_WINDOW_SECONDS: ${SOURCE_LIMIT_WINDOW_SECONDS:-60}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BACKOFFICE_REFRESH_TOKEN_EXPIRE_DAYS: ${BACKOFFICE_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-barbershop_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3004,http://127.0.0.1:3004,http://localhost:4040,http://127.0.0.1:4040,http://localhost:3010,http://127.0.0.1:3010,http://localhost:8000,http://127.0.0.1:8000,http://localhost:6060,http://127.0.0.1:6060}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CAMPAIGN_RUN_SCHEDULER_ENABLED: ${CAMPAIGN_RUN_SCHEDULER_ENABLED:-false}
      CAMPAIGN_RUN_SCHEDULER_INTERVAL_SECONDS: ${CAMPAIGN_RUN_SCHEDULER_INTERVAL_SECONDS:-30}
      SMS_QUEUE_WORKER_ENABLED: ${SMS_QUEUE_WORKER_ENABLED:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-stub}
      SMS_SENDER_NAME: ${SMS_SENDER_NAME:-Soul Cuts}
      SMS_CLUB_TOKEN: ${SMS_CLUB_TOKEN:-}
      SMS_CLUB_BASE_URL: ${SMS_CLUB_BASE_URL:-https://im.smsclub.mobi}
      SMS_DELIVERY_STATUS_SCHEDULER_ENABLED: ${SMS_DELIVERY_STATUS_SCHEDULER_ENABLED:-true}
      SMS_DELIVERY_STATUS_POLL_INTERVAL_SECONDS: ${SMS_DELIVERY_STATUS_POLL_INTERVAL_SECONDS:-60}
      SMS_DELIVERY_STATUS_MAX_AGE_HOURS: ${SMS_DELIVERY_STATUS_MAX_AGE_HOURS:-48}
      SMS_OTP_TEMPLATE: "${SMS_OTP_TEMPLATE:-Ваш код для входу в Soul Cuts: {code}. Нікому його не повідомляйте.}"
      BOOKING_SMS_NOTIFICATIONS_ENABLED: ${BOOKING_SMS_NOTIFICATIONS_ENABLED:-false}
      BOOKING_AUTO_COMPLETION_ENABLED: ${BOOKING_AUTO_COMPLETION_ENABLED:-true}
      BOOKING_AUTO_COMPLETION_STARTS_ON: ${BOOKING_AUTO_COMPLETION_STARTS_ON:-2026-10-11}
      BOOKING_AUTO_COMPLETION_INTERVAL_SECONDS: ${BOOKING_AUTO_COMPLETION_INTERVAL_SECONDS:-60}
      BOOKING_SMS_REMINDERS_ENABLED: ${BOOKING_SMS_REMINDERS_ENABLED:-false}
      BOOKING_SMS_TWO_HOUR_REMINDERS_ENABLED: ${BOOKING_SMS_TWO_HOUR_REMINDERS_ENABLED:-true}
      BOOKING_SMS_TWO_HOUR_REMINDER_LEAD_HOURS: ${BOOKING_SMS_TWO_HOUR_REMINDER_LEAD_HOURS:-2}
      BOOKING_SMS_TWO_HOUR_REMINDER_WINDOW_MINUTES: ${BOOKING_SMS_TWO_HOUR_REMINDER_WINDOW_MINUTES:-30}
      BOOKING_SMS_CONFIRMATION_TEMPLATE: "${BOOKING_SMS_CONFIRMATION_TEMPLATE:-Ви записані до майстра {master_name} на {appointment_date} о {appointment_time}. Чекаємо у {barbershop_name}.}"
      BOOKING_SMS_TWO_HOUR_REMINDER_TEMPLATE: "${BOOKING_SMS_TWO_HOUR_REMINDER_TEMPLATE:-Нагадуємо, сьогодні о {appointment_time} у вас візит до майстра {master_name}. Будемо раді бачити вас у {barbershop_name}.}"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_SEND_TIMEOUT_SECONDS: ${TELEGRAM_SEND_TIMEOUT_SECONDS:-10}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://soulcuts.com.ua}
      BACKOFFICE_URL: ${BACKOFFICE_URL:-https://admin.soulcuts.com.ua}
      MESSAGING_MAX_RETRY_ATTEMPTS: ${MESSAGING_MAX_RETRY_ATTEMPTS:-3}
      MESSAGING_RETRY_DELAY_MINUTES: ${MESSAGING_RETRY_DELAY_MINUTES:-15}
      MESSAGING_BATCH_SIZE: ${MESSAGING_BATCH_SIZE:-50}
      MASTER_SCHEDULE_REMINDER_SCHEDULER_ENABLED: ${MASTER_SCHEDULE_REMINDER_SCHEDULER_ENABLED:-true}
      MASTER_SCHEDULE_REMINDER_SCHEDULER_INTERVAL_SECONDS: ${MASTER_SCHEDULE_REMINDER_SCHEDULER_INTERVAL_SECONDS:-300}
      MESSAGING_DEFAULT_REVIEW_URL: ${MESSAGING_DEFAULT_REVIEW_URL:-}
      BARBERSHOP_NAME: ${BARBERSHOP_NAME:-Soul Cuts}
      BREVO_SYNC_ENABLED: ${BREVO_SYNC_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_CONTACT_LIST_ID: ${BREVO_CONTACT_LIST_ID:-}
      BREVO_API_BASE_URL: ${BREVO_API_BASE_URL:-https://api.brevo.com/v3}
      BREVO_TIMEOUT_SECONDS: ${BREVO_TIMEOUT_SECONDS:-10}
      NOVA_POSHTA_API_KEY: ${NOVA_POSHTA_API_KEY:-}
      NOVA_POSHTA_API_URL: ${NOVA_POSHTA_API_URL:-https://api.novaposhta.ua/v2.0/json/}
      NOVA_POSHTA_TIMEOUT_SECONDS: ${NOVA_POSHTA_TIMEOUT_SECONDS:-10}
      NOVA_POSHTA_DIRECTORY_ENABLED: ${NOVA_POSHTA_DIRECTORY_ENABLED:-true}
      NOVA_POSHTA_DIRECTORY_REFRESH_HOURS: ${NOVA_POSHTA_DIRECTORY_REFRESH_HOURS:-24}
      NOVA_POSHTA_DIRECTORY_POLL_SECONDS: ${NOVA_POSHTA_DIRECTORY_POLL_SECONDS:-3600}
      PRODUCT_TOP_SCHEDULER_ENABLED: ${PRODUCT_TOP_SCHEDULER_ENABLED:-true}
      PRODUCT_TOP_CHECK_INTERVAL_DAYS: ${PRODUCT_TOP_CHECK_INTERVAL_DAYS:-7}
      PRODUCT_TOP_REFRESH_INTERVAL_DAYS: ${PRODUCT_TOP_REFRESH_INTERVAL_DAYS:-30}
      PRODUCT_TOP_WINDOW_DAYS: ${PRODUCT_TOP_WINDOW_DAYS:-30}
      PRODUCT_TOP_FRACTION: ${PRODUCT_TOP_FRACTION:-0.1}
      PRODUCT_TOP_MAX_PRODUCTS: ${PRODUCT_TOP_MAX_PRODUCTS:-8}
      PRODUCT_TOP_MIN_UNIQUE_VIEWS: ${PRODUCT_TOP_MIN_UNIQUE_VIEWS:-30}
      PRODUCT_TOP_MIN_PAID_ORDERS: ${PRODUCT_TOP_MIN_PAID_ORDERS:-3}
      PRODUCT_VIEW_RETENTION_DAYS: ${PRODUCT_VIEW_RETENTION_DAYS:-90}
      SERVICE_POPULARITY_SCHEDULER_ENABLED: ${SERVICE_POPULARITY_SCHEDULER_ENABLED:-true}
      SERVICE_POPULARITY_CHECK_INTERVAL_DAYS: ${SERVICE_POPULARITY_CHECK_INTERVAL_DAYS:-7}
      SERVICE_POPULARITY_REFRESH_INTERVAL_DAYS: ${SERVICE_POPULARITY_REFRESH_INTERVAL_DAYS:-30}
      SERVICE_POPULARITY_WINDOW_DAYS: ${SERVICE_POPULARITY_WINDOW_DAYS:-30}
      BOOKING_FUNNEL_HASH_SECRET: ${BOOKING_FUNNEL_HASH_SECRET:-}
      BOOKING_FUNNEL_EVENT_RATE_LIMIT: ${BOOKING_FUNNEL_EVENT_RATE_LIMIT:-120}
      BOOKING_FUNNEL_DIGEST_SCHEDULER_ENABLED: ${BOOKING_FUNNEL_DIGEST_SCHEDULER_ENABLED:-true}
      BOOKING_FUNNEL_DIGEST_SCHEDULER_INTERVAL_SECONDS: ${BOOKING_FUNNEL_DIGEST_SCHEDULER_INTERVAL_SECONDS:-3600}
      BOOKING_FUNNEL_NO_SLOT_ALERT_MIN_COUNT: ${BOOKING_FUNNEL_NO_SLOT_ALERT_MIN_COUNT:-3}
      BOOKING_FUNNEL_NO_SLOT_ALERT_RATE_PERCENT: ${BOOKING_FUNNEL_NO_SLOT_ALERT_RATE_PERCENT:-20}
      BOOKING_FUNNEL_STALE_SCHEDULE_ALERT_COUNT: ${BOOKING_FUNNEL_STALE_SCHEDULE_ALERT_COUNT:-1}
      BOOKING_FUNNEL_ERROR_ALERT_COUNT: ${BOOKING_FUNNEL_ERROR_ALERT_COUNT:-1}
      BOOKING_FUNNEL_MEANINGFUL_STEP_SESSIONS: ${BOOKING_FUNNEL_MEANINGFUL_STEP_SESSIONS:-5}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_EVENT_THROTTLE_SECONDS: ${SENTRY_EVENT_THROTTLE_SECONDS:-600}
    command: sh /app/scripts/start.sh
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/public/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    container_name: barbershop-platform-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbershop_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbershop_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
