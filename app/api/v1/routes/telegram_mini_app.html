<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій запис · Soulcuts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:'Cy Grotesk';src:url('./booking-app/assets/cy-grotesk-600.woff2') format('woff2');font-weight:600;font-display:swap}
:root{color-scheme:dark;font:16px 'Cy Grotesk',Inter,system-ui,sans-serif;background:#0a0a0a;color:#fff}
*{box-sizing:border-box}
body{margin:0}
main{max-width:440px;margin:auto;padding:24px 18px}
header{font-size:12px;font-weight:700;letter-spacing:.18em;color:#a3a3a3}
h1{font-size:clamp(24px,7vw,32px);font-weight:650;line-height:1.1;margin:8px 0 20px}
h2{font-size:16px;margin:24px 0 8px}
article{background:rgb(255 255 255 / 5%);padding:16px;margin-block:12px}
p{margin:8px 0;overflow-wrap:anywhere}
.muted{color:#a3a3a3;font-size:13px}
.when{font-size:19px;font-weight:750}
button{min-height:44px;padding:8px;background:rgb(255 255 255 / 6%);color:#fff;border:0;font:inherit;font-weight:650;cursor:pointer}
button[aria-pressed=true],button.primary{background:#fff;color:#0a0a0a}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.grid button,nav button{border-radius:4px}
button:disabled{opacity:.5;cursor:default}
.primary,.back{width:100%;margin-top:12px}
.primary{text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0}
nav button{min-width:44px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 12px}
.stepper button{padding:4px;font-size:11px;min-height:36px;text-transform:uppercase;letter-spacing:.04em}
.stepper .complete{background:#173d32;color:#ecfdf5;box-shadow:inset 0 -3px #34d399}
.stepper [aria-current=step]{background:#fff;color:#0a0a0a}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiles button{min-height:82px;text-align:left;padding:12px;overflow-wrap:anywhere}
.tiles .meta{display:block;margin-top:8px;font-size:12px}
.tiles [aria-pressed=true]{background:rgb(255 255 255 / 9%);color:#fff;box-shadow:inset 0 -3px #34d399}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.calendar-grid .weekday{font-size:11px;color:#a3a3a3;padding:4px 0;text-transform:uppercase}
.calendar-grid button{border-radius:4px;padding:2px;min-width:0}
.calendar-grid button:disabled{background:transparent}
#status{min-height:22px;margin-top:12px}
</style>
</head>
<body>
<main>
<header>SOULCUTS</header>
<h1 id="title">Мій запис</h1>
<section id="screen" aria-labelledby="title"></section>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script>
const app = window.Telegram?.WebApp;
const screen = document.getElementById('screen');
const status = document.getElementById('status');
const title = document.getElementById('title');
const api = location.pathname.replace(/\/$/, '');
const formatter = new Intl.DateTimeFormat('uk-UA', {timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit'});
let visits = [], pastVisits = [], dates = [], current, day, slot, page, available, busy = false;
let masters, draft;
const monthFormat = new Intl.DateTimeFormat('uk-UA', {month:'long',year:'numeric', timeZone:'UTC'});

function add(parent, tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  parent.append(element);
  return element;
}
function button(parent, label, handler, {disabled=false, selected, className}={}) {
  const control = add(parent, 'button', label, className);
  control.disabled = disabled;
  if (selected !== undefined) control.setAttribute('aria-pressed', String(selected));
  control.addEventListener('click', handler);
}
async function request(path='', body) {
  const headers = {'X-Telegram-Init-Data':app.initData};
  if (body) headers['Content-Type'] = 'application/json';
  const response = await fetch(api + path, {
    cache:'no-store', headers, method:body ? 'POST' : 'GET',
    body:body ? JSON.stringify(body) : undefined,
  });
  if (!response.ok) {
    const result = await response.json().catch(() => ({}));
    throw new Error(typeof result.detail === 'string' ? result.detail : 'Спробуйте ще раз.');
  }
  return response.json();
}
function visitList() {
  current = null;
  app.BackButton.hide();
  title.textContent = 'Мій запис';
  screen.replaceChildren();
  draft = null;
  button(screen, 'Новий запис', () => newBooking(), {className:'primary'});
  if (!visits.length) add(screen, 'p', 'У вас немає майбутніх записів.');
  for (const visit of visits) {
    const card = add(screen, 'article', '');
    add(card, 'p', 'Підтверджено', 'muted');
    add(card, 'p', visit.when, 'when');
    add(card, 'p', visit.master);
    add(card, 'p', visit.services.join(', '));
    if (visit.price != null) add(card, 'p', visit.price + ' грн');
    button(card, 'Перенести', () => {
      current = visit; day = null; slot = null; page = 0; available = [];
      status.textContent = 'Оберіть дату.';
      app.BackButton.show();
      calendar();
    }, {className:'primary'});
    button(card, 'Скасувати запис', () => cancellation(visit), {className:'back'});
  }
  if (pastVisits.length) {
    add(screen, 'h2', 'Минулі візити');
    for (const visit of pastVisits) {
      const card = add(screen, 'article', '');
      add(card, 'p', visit.when, 'when');
      add(card, 'p', visit.master);
      add(card, 'p', visit.services.join(', '));
      button(card, 'Записатися знову', () => newBooking(visit), {className:'back'});
    }
  }
  button(screen, 'Повернутися до чату', () => app.close(), {className:'back'});
}
function cancellation(visit) {
  current = visit;
  title.textContent = 'Скасування запису';
  status.textContent = '';
  screen.replaceChildren();
  app.BackButton.show();
  add(screen, 'p', visit.when, 'when');
  add(screen, 'p', 'Після скасування цей час стане доступним для інших клієнтів.');
  button(screen, 'Підтвердити скасування', async (event) => {
    const control = event.currentTarget;
    if (busy) return;
    busy = true;
    control.disabled = true;
    try {
      await request('/visits/' + visit.id + '/cancel', {version:visit.version});
      visits = visits.filter(item => item.id !== visit.id);
      status.textContent = 'Запис скасовано.';
      visitList();
    } catch (error) {
      status.textContent = error.message;
      control.disabled = false;
    } finally {
      busy = false;
    }
  }, {className:'primary'});
  button(screen, 'Залишити запис', back, {className:'back'});
}
function calendar() {
  title.textContent = 'Перенесення запису';
  screen.replaceChildren();
  const card = add(screen, 'article', '');
  add(card, 'p', 'Поточний запис', 'muted');
  add(card, 'p', current.when, 'when');
  button(screen, 'Найближчий вільний час', findNext, {disabled:busy,className:'back'});
  monthCalendar(screen, day, page, nextPage => { page = nextPage; calendar(); }, chooseDay);
  add(screen, 'h2', 'Вільний час');
  const times = add(screen, 'div', '', 'grid');
  for (const time of available) {
    button(times, formatter.format(new Date(time)), () => { slot = time; calendar(); },
      {disabled:busy, selected:slot === time});
  }
  button(screen, 'Підтвердити перенесення', move, {disabled:busy || !slot,className:'primary'});
  button(screen, 'Залишити поточний запис', back, {disabled:busy,className:'back'});
}
function back() {
  if (busy) return;
  status.textContent = '';
  visitList();
}
async function findNext() {
  busy = true;
  status.textContent = 'Шукаємо найближчий час…';
  calendar();
  try {
    const next = await request('/visits/' + current.id + '/next');
    if (next.day) {
      day = next.day;
      slot = null;
      page = monthIndex(day);
      if (page < 0) page = 0;
      available = next.slots;
      status.textContent = 'Оберіть час.';
    } else {
      status.textContent = 'Немає вільного часу серед найближчих семи робочих днів.';
    }
  } catch (error) {
    status.textContent = error.message;
  } finally {
    busy = false;
    calendar();
  }
}
async function chooseDay(date) {
  day = date; slot = null; available = []; busy = true;
  status.textContent = 'Завантаження…'; calendar();
  try {
    available = await request('/visits/' + current.id + '/slots?day=' + encodeURIComponent(date));
    status.textContent = available.length ? 'Оберіть час.' : 'На цю дату немає вільного часу.';
  } catch (error) { status.textContent = error.message; }
  finally { busy = false; calendar(); }
}
async function move() {
  if (!slot || busy) return;
  busy = true; status.textContent = 'Зберігаємо запис…'; calendar();
  try {
    const updated = await request('/visits/' + current.id + '/move', {start:slot,version:current.version});
    visits = visits.map(visit => visit.id === updated.id ? updated : visit);
    status.textContent = 'Запис перенесено.';
    visitList();
  } catch (error) {
    slot = null;
    status.textContent = error.message;
  } finally {
    busy = false;
    if (current) calendar();
  }
}
function monthIndex(day) {
  const months = [...new Set(dates.map(value => value.slice(0,7)))];
  return months.indexOf(day.slice(0,7));
}
function monthCalendar(parent, selected, index, changeMonth, choose) {
  const months = [...new Set(dates.map(value => value.slice(0,7)))];
  const month = months[index];
  if (!month) return;
  const first = new Date(month + '-01T00:00:00Z');
  const nav = add(parent, 'nav', '');
  button(nav, '←', () => changeMonth(index - 1), {disabled:busy || index === 0});
  add(nav, 'strong', monthFormat.format(first));
  button(nav, '→', () => changeMonth(index + 1), {disabled:busy || index === months.length - 1});
  const grid = add(parent, 'div', '', 'calendar-grid');
  for (const weekday of ['Пн','Вт','Ср','Чт','Пт','Сб','Нд']) add(grid, 'span', weekday, 'weekday');
  const blanks = (first.getUTCDay() + 6) % 7;
  for (let i = 0; i < blanks; i++) add(grid, 'span', '');
  const total = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth()+1, 0)).getUTCDate();
  for (let d = 1; d <= total; d++) {
    const date = month + '-' + String(d).padStart(2,'0');
    button(grid, String(d), () => choose(date), {selected:date === selected, disabled:busy || !dates.includes(date)});
    grid.lastElementChild.setAttribute('aria-label', date);
  }
}
function bookingSteps() {
  const steps = add(screen, 'div', '', 'stepper');
  for (const [index,label] of ['Послуги','Майстер','Дата і час','Деталі'].entries()) {
    button(steps, label, () => {
      draft.step = index;
      if (index !== 3) draft.confirmation = null;
      status.textContent = '';
      bookingForm();
    }, {disabled:busy || index > draft.step, className:index < draft.step ? 'complete' : undefined});
    if (index === draft.step) steps.lastElementChild.setAttribute('aria-current','step');
  }
}
async function newBooking(previous) {
  if (busy) return;
  busy = true;
  status.textContent = 'Завантаження…';
  try {
    masters ??= await request('/catalog');
    const master = masters.find(item => item.id === previous?.master_id);
    const activeIds = new Set(master?.services.map(item => item.id));
    const canRepeat = master && previous.service_ids.length && previous.service_ids.every(id => activeIds.has(id));
    const keys = canRepeat ? master.services.filter(item => previous.service_ids.includes(item.id)).map(item => item.key) : [];
    draft = {master:canRepeat ? master.id : null, keys, step:canRepeat ? 2 : 0,
             day:'', month:0, slots:[], alternatives:[], confirmation:null};
    status.textContent = previous && !canRepeat ? 'Оберіть актуального майстра й послуги.' : '';
    app.BackButton.show();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    busy = false;
    if (draft) bookingForm();
  }
}
function bookingForm() {
  title.textContent = 'Новий запис';
  screen.replaceChildren();
  const selection = draft;
  bookingSteps();
  const master = masters.find(item => item.id === selection.master);
  if (selection.confirmation) {
    const choice = selection.confirmation;
    add(screen, 'h2', 'Підтвердження запису');
    add(screen, 'p', choice.label);
    add(screen, 'p', choice.services);
    add(screen, 'p', choice.price + ' грн', 'when');
    button(screen, 'Підтвердити запис', () => updateDraft(async () => {
      const result = await request('/create', {...choice.payload, expected_total_amount:choice.price});
      visits.push(result);
      visits.sort((a,b) => Date.parse(a.version[1]) - Date.parse(b.version[1]));
      visitList();
      status.textContent = 'Запис підтверджено.';
    }), {disabled:busy,className:'primary'});
    button(screen, 'Змінити час', () => { selection.confirmation = null; selection.step = 2; bookingForm(); },
      {disabled:busy,className:'back'});
    return;
  }
  const compatible = masters.filter(person => selection.keys.every(key => person.services.some(item => item.key === key)));
  if (selection.step === 0) {
    add(screen, 'h2', 'Оберіть послуги');
    const tiles = add(screen, 'div', '', 'tiles');
    const services = new Map(masters.flatMap(person => person.services).map(item => [item.key,item]));
    for (const item of services.values()) {
      const picked = selection.keys.includes(item.key);
      const compatibleWithItem = compatible.some(person => person.services.some(service => service.key === item.key));
      button(tiles, item.name, () => {
        selection.keys = picked ? selection.keys.filter(key => key !== item.key) : [...selection.keys,item.key];
        selection.master = null; selection.slots = []; selection.alternatives = [];
        bookingForm();
      }, {disabled:busy || (!picked && (!compatibleWithItem || selection.keys.length >= 10)), selected:picked});
      add(tiles.lastElementChild, 'span', item.duration + ' хв', 'meta');
    }
    button(screen, 'Далі', () => { selection.step = 1; bookingForm(); },
      {disabled:busy || !selection.keys.length,className:'primary'});
    return;
  }
  if (selection.step === 1) {
    add(screen, 'h2', 'Оберіть майстра');
    const tiles = add(screen, 'div', '', 'tiles');
    for (const person of compatible) {
      button(tiles, person.name, () => {
        Object.assign(selection, {master:person.id, step:2, slots:[], alternatives:[]});
        bookingForm();
      }, {disabled:busy,selected:person.id === selection.master});
    }
    return;
  }
  if (!master) return;
  add(screen, 'h2', 'Оберіть дату');
  const serviceIds = selection.keys.map(key => master.services.find(item => item.key === key).id);
  monthCalendar(screen, selection.day, selection.month, page => {
    selection.month = page;
    bookingForm();
  }, date => {
    selection.day = date;
    selection.alternatives = [];
    selection.slots = [];
    updateDraft(async () => {
      selection.slots = await request('/search', {master_id:master.id,service_ids:serviceIds,day:date});
      status.textContent = selection.slots.length ? 'Оберіть час.' : 'На цю дату немає вільного часу.';
    });
  });
  const valid = dates.includes(selection.day);
  const criteria = {master_id:selection.master, service_ids:serviceIds, day:selection.day};
  if (selection.slots.length) {
    const times = add(screen, 'div', '', 'grid');
    for (const time of selection.slots) {
      button(times, formatter.format(new Date(time.start_at)), () =>
        reviewBooking(master.name, {...criteria,start:time.start_at}), {disabled:busy});
    }
  }
  button(screen, 'Пошукати в інших майстрів', () => updateDraft(async () => {
    selection.alternatives = await request('/alternatives', criteria);
    status.textContent = selection.alternatives.length ? 'Оберіть майстра й час.' : 'Інших варіантів немає.';
  }), {disabled:busy || !valid,className:'back'});
  for (const option of selection.alternatives) {
    const label = option.master.name + ' · ' + option.date + ' · ' + formatter.format(new Date(option.start_at));
    button(screen, label, () => reviewBooking(option.master.name, {
      master_id:option.master.id, service_ids:option.service_ids, start:option.start_at,
    }), {disabled:busy,className:'back'});
  }
  if (valid) {
    button(screen, 'Повідомити про вільний час', () => waitlistConsent(criteria), {disabled:busy,className:'back'});
  }
}
function waitlistConsent(criteria) {
  screen.replaceChildren();
  title.textContent = 'Лист очікування';
  add(screen, 'p', 'Погоджуюся отримати повідомлення, якщо звільниться час на ' + criteria.day + '.');
  button(screen, 'Погоджуюся та приєднуюсь', () => updateDraft(async () => {
    await request('/waitlist', {...criteria,notification_consent:true});
    status.textContent = 'Ви в листі очікування.';
  }), {className:'primary'});
  button(screen, 'Назад', bookingForm, {className:'back'});
}
async function updateDraft(action) {
  if (busy) return;
  busy = true;
  status.textContent = 'Зачекайте…';
  bookingForm();
  try { await action(); }
  catch (error) { status.textContent = error.message; }
  finally {
    busy = false;
    if (draft) bookingForm();
  }
}
function reviewBooking(name, choice) {
  const {master_id,service_ids,start} = choice;
  return updateDraft(async () => {
    const payload = {master_id,service_ids,start};
    const quote = await request('/quote', payload);
    const time = new Intl.DateTimeFormat('uk-UA', {timeZone:'Europe/Kyiv',dateStyle:'long',timeStyle:'short'});
    draft.step = 3;
    const person = masters.find(item => item.id === master_id);
    const names = person?.services.filter(item => service_ids.includes(item.id)).map(item => item.name) ?? [];
    draft.confirmation = {payload, price:quote.total_amount, services:names.join(', '),
                          label:name + ' · ' + time.format(new Date(start))};
    status.textContent = '';
  });
}
async function start() {
  if (!app?.initData) {
    status.textContent = 'Відкрийте «Мій запис» у Telegram.';
    return;
  }
  app.ready();
  app.setHeaderColor?.('#0a0a0a');
  app.setBackgroundColor?.('#0a0a0a');
  app.expand();
  app.BackButton.onClick(back);
  status.textContent = 'Завантаження…';
  try {
    ({visits,history:pastVisits,dates} = await request('/visits'));
    status.textContent = '';
    visitList();
  } catch (error) {
    status.textContent = error.message;
    button(screen, 'Спробувати ще раз', () => { screen.replaceChildren(); start(); }, {className:'back'});
  }
}
start();
</script>
</body>
</html>
