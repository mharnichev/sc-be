name: Verify booking funnel and sensitive booking contracts
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [codex/booking-funnel-observability-20261103, codex/inventory-booking-release-20261104, codex/pos-combined-release-20261106]
permissions:
  contents: read
jobs:
  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: synthetic-funnel-test-only
          POSTGRES_DB: booking_analytics_test_release
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_analytics_test_release"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      SECRET_KEY: synthetic-booking-funnel-tests-only-key
      DATABASE_URL: postgresql+asyncpg://postgres:synthetic-funnel-test-only@127.0.0.1:5432/booking_analytics_test_release
      INVENTORY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-funnel-test-only@127.0.0.1:5432/booking_analytics_test_release
      SEGMENTS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-funnel-test-only@127.0.0.1:5432/booking_analytics_test_release
      BOOKING_AVAILABILITY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-funnel-test-only@127.0.0.1:5432/booking_analytics_test_release
      BOOKING_ANALYTICS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-funnel-test-only@127.0.0.1:5432/booking_analytics_test_release
      SMS_PROVIDER: mock
      BACKGROUND_WORKERS_ENABLED: 'false'
      EMAIL_NOTIFICATIONS_ENABLED: 'false'
      SENTRY_DSN: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Migration upgrade and downgrade round trip
        run: |
          python -m alembic upgrade 0144_master_rewards
          python -m alembic upgrade head
          python -m alembic downgrade 0144_master_rewards
          python -m alembic upgrade head
      - name: HTTP, PostgreSQL and sensitive booking regressions (no skips)
        run: |
          python - <<'PY'
          from pathlib import Path
          import pytest
          class RequiredCoverage:
              skipped = []
              def pytest_runtest_logreport(self, report):
                  if report.skipped:
                      self.skipped.append(report.nodeid)
          gate = RequiredCoverage()
          paths = sorted({str(path) for pattern in ('test_booking*.py', 'test_waitlist*.py', 'test_statistics*.py')
                          for path in Path('tests').glob(pattern)})
          paths += ['tests/test_inventory_receipt_changes_integration.py', 'tests/test_inventory.py',
                    'tests/test_inventory_integration.py', 'tests/test_mobile_inventory.py',
                    'tests/test_stock_owner_policy_integration.py']
          paths += [
              'tests/test_monobank_invoice_create_contract.py',
              'tests/test_monobank_provider_contract.py',
              'tests/test_monobank_inspection_contract.py',
              'tests/test_shop_online_payment_integration.py',
              'tests/test_shop_online_payment_actions_integration.py',
              'tests/test_shop_online_payment_channel.py',
              'tests/test_shop_online_cod_coexistence.py',
              'tests/test_unified_catalog_http_integration.py',
              'tests/test_product_recommendations_integration.py',
              'tests/test_shop_sale_filter_integration.py',
              'tests/test_catalog_assembly_http_integration.py',
              'tests/test_public_product_stock_filter.py',
              'tests/test_catalog_stock_order.py',
              'tests/test_shop_ecommerce.py',
              'tests/test_catalog_size_filters.py',
              'tests/test_shop_promotions.py',
              'tests/test_product_shop_price.py',
              'tests/test_catalog_visibility.py',
              'tests/test_shop_checkout_gate.py',
              'tests/test_shop_checkout_pilot.py',
              'tests/test_product_ingredients.py',
              'tests/test_pos_quick_checkout.py',
              'tests/test_pos_quick_http_integration.py',
              'tests/test_master_mono_integration.py',
              'tests/test_master_mono_live_integration.py',
              'tests/test_master_mono_expired_close.py',
              'tests/test_master_sales_integration.py',
              'tests/test_mono_checkbox_poll_integration.py',
              'tests/test_local_sales_integration.py',
              'tests/test_monthly_discounts.py',
          ]
          paths = sorted(set(paths))
          result = pytest.main(['-p','anyio.pytest_plugin','-q','--tb=short', *paths], plugins=[gate])
          if gate.skipped:
              raise SystemExit('Required booking or inventory coverage skipped: ' + ', '.join(gate.skipped))
          raise SystemExit(result)
          PY
